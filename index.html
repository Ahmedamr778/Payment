<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أرقام الحسابات البنكية | مصوغات ومجوهرات علاء عبدالحي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@600&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F5F6F3; --card:#FFFFFF; --ink:#16231F; --muted:#5C6B66; --line:#DFE4E0;
  --head:#0E3B33; --head-ink:#F3E3B5; --gold:#9A6F17; --gold-soft:#F6EBCB; --ok:#1E7A4F;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1513; --card:#17211E; --ink:#EDF2EF; --muted:#9DAEA8; --line:#26332F;
    --head:#0A2B25; --head-ink:#F3E3B5; --gold:#E3B552; --gold-soft:#2B2514; --ok:#5FD39A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1513; --card:#17211E; --ink:#EDF2EF; --muted:#9DAEA8; --line:#26332F;
  --head:#0A2B25; --head-ink:#F3E3B5; --gold:#E3B552; --gold-soft:#2B2514; --ok:#5FD39A;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Tajawal","Segoe UI",Tahoma,Arial,sans-serif;font-size:17px;line-height:1.6}
header{background:var(--head);color:var(--head-ink);padding:32px 20px 40px;text-align:center}
header h1{margin:0;font-family:"Reem Kufi","Tajawal",Tahoma,sans-serif;font-weight:600;font-size:clamp(26px,7vw,36px);line-height:1.3}
header p{margin:8px 0 0;color:#CFE0DA;font-size:16px}
main{max-width:560px;margin:-20px auto 0;padding:0 16px 40px}
.hint{background:var(--gold-soft);color:var(--ink);border-radius:12px;padding:12px 16px;margin:0 0 16px;font-size:15.5px;border:1px solid var(--line)}
.acc{background:var(--card);border:1px solid var(--line);border-inline-start:5px solid var(--gold);border-radius:12px;padding:16px;margin-bottom:14px}
.bank{margin:0;font-weight:700;font-size:19px}
.holder{margin:2px 0 12px;color:var(--muted);font-size:15.5px}
.num{display:block;direction:ltr;text-align:center;font-variant-numeric:tabular-nums;font-weight:700;font-size:clamp(20px,6vw,26px);letter-spacing:.06em;padding:12px 8px;background:var(--bg);border-radius:8px;margin-bottom:12px;overflow-wrap:anywhere;user-select:all}
button{width:100%;min-height:50px;border:0;border-radius:10px;background:var(--head);color:var(--head-ink);font:inherit;font-weight:700;font-size:17px;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button:active{transform:scale(.98)}
button.done{background:var(--ok);color:#fff}
footer{text-align:center;color:var(--muted);font-size:14px;padding:0 16px 24px}
</style>
</head>
<body>
<header>
  <h1>مصوغات ومجوهرات علاء عبدالحي</h1>
  <p>أرقام الحسابات للتحويل</p>
</header>
<main>
  <p class="hint">اضغط «نسخ الرقم»، ثم افتح إنستا باي أو تطبيق البنك والصق الرقم وحوّل.</p>
  <div id="list"></div>
</main>
<footer>بعد التحويل أرسل صورة الإيصال للمحل.</footer>

<script>
var ACCOUNTS=[
  {bank:"بنك مصر",name:"البراء علاء الدين محمد محمد عبدالحي",num:"1870001000015471"},
  {bank:"بنك مصر",name:"علاء الدين محمد محمد عبدالحي",num:"2640001000007815"},
  {bank:"البنك الأهلي المصري",name:"علاء الدين محمد محمد عبدالحي",num:"3923171064796401018"},
  {bank:"بنك الإسكندرية",name:"البراء علاء الدين محمد محمد",num:"336000060001"}
];
function group(s){return s.replace(/(.{4})/g,"$1 ").trim();}
function fallbackCopy(t){
  var a=document.createElement("textarea");
  a.value=t;a.setAttribute("readonly","");a.style.position="fixed";a.style.opacity="0";
  document.body.appendChild(a);a.select();a.setSelectionRange(0,t.length);
  var ok=false;try{ok=document.execCommand("copy");}catch(e){}
  document.body.removeChild(a);return ok;
}
function copyText(t){
  if(navigator.clipboard&&window.isSecureContext){
    return navigator.clipboard.writeText(t).then(function(){return true;},function(){return fallbackCopy(t);});
  }
  return Promise.resolve(fallbackCopy(t));
}
var list=document.getElementById("list");
ACCOUNTS.forEach(function(a){
  var d=document.createElement("section");d.className="acc";
  var b=document.createElement("h2");b.className="bank";b.textContent=a.bank;
  var h=document.createElement("p");h.className="holder";h.textContent=a.name;
  var n=document.createElement("span");n.className="num";n.textContent=group(a.num);
  var btn=document.createElement("button");btn.type="button";btn.textContent="نسخ الرقم";
  btn.addEventListener("click",function(){
    copyText(a.num).then(function(ok){
      btn.textContent=ok?"تم نسخ الرقم":"اضغط مطولًا على الرقم لنسخه";
      if(ok)btn.classList.add("done");
      setTimeout(function(){btn.textContent="نسخ الرقم";btn.classList.remove("done");},2200);
    });
  });
  d.appendChild(b);d.appendChild(h);d.appendChild(n);d.appendChild(btn);
  list.appendChild(d);
});
</script>
</body>
</html>
